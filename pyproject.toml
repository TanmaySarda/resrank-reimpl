[project]
name = "resrank"
version = "0.1.0"
description = "Clone of ResRank: unified retrieval + listwise reranking with passage compression"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
